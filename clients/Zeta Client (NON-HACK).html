
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Utility 1.11.2">
  <title>Zeta Client</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #1746d1;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #loader {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    #logo {
      width: min(520px, 85vw);
      max-height: 260px;
      object-fit: contain;
      margin-bottom: 32px;
    }

    #status {
      font-size: 18px;
      margin-bottom: 14px;
    }

    #progress-container {
      width: min(420px, 85vw);
      height: 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 20px;
      overflow: hidden;
    }

    #progress {
      width: 0%;
      height: 100%;
      background: #ff1744;
      transition: width 0.15s ease;
    }

    #details {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.9;
    }

    #error {
      display: none;
      margin-top: 18px;
      color: white;
    }

    button {
      margin-top: 14px;
      padding: 10px 22px;
      border: 0;
      border-radius: 6px;
      background: #ff1744;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    #game {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: black;
    }
  </style>
</head>
<body>
  <div id="loader">
    <img
      id="logo"
      src="https://raw.githubusercontent.com/sigmapoopyman69/eaglercraft-client-launcher/main/amazing_logo.png"
      alt="Eaglercraft"
    >

    <div id="status">Loading Zeta Client...</div>

    <div id="progress-container">
      <div id="progress"></div>
    </div>

    <div id="details">Preparing download...</div>

    <div id="error">
      <div id="error-message">Failed to load Zeta Client.</div>
      <button onclick="loadClient()">Retry</button>
    </div>
  </div>

  <iframe
    id="game"
    allow="fullscreen; autoplay; clipboard-read; clipboard-write"
    allowfullscreen
  ></iframe>

  <script>
    const SOURCE =
      "https://raw.githubusercontent.com/MilkdromedaStudios/all-of-eaglercraft/main/Zeta%20Client.html";

    const statusText = document.getElementById("status");
    const progress = document.getElementById("progress");
    const details = document.getElementById("details");
    const errorBox = document.getElementById("error");
    const errorMessage = document.getElementById("error-message");
    const loader = document.getElementById("loader");
    const game = document.getElementById("game");

    function getFileSize() {
      return new Promise(resolve => {
        const xhr = new XMLHttpRequest();
        xhr.open("HEAD", SOURCE);
        xhr.onload = () => {
          const size = Number(xhr.getResponseHeader("Content-Length"));
          resolve(size > 0 ? size : 0);
        };
        xhr.onerror = () => resolve(0);
        xhr.send();
      });
    }

    async function loadClient() {
      errorBox.style.display = "none";
      progress.style.width = "0%";
      statusText.textContent = "Loading Zeta Client...";
      details.textContent = "Preparing download...";
      loader.style.display = "flex";
      game.style.display = "none";

      const totalSize = await getFileSize();

      const xhr = new XMLHttpRequest();
      xhr.open("GET", SOURCE);
      xhr.responseType = "blob";

      xhr.onprogress = event => {
        const loadedMB = (event.loaded / 1048576).toFixed(2);

        if (event.lengthComputable && event.total > 0) {
          const percent = (event.loaded / event.total) * 100;
          progress.style.width = percent + "%";
          details.textContent =
            `${percent.toFixed(1)}% • ${loadedMB} MB / ${(event.total / 1048576).toFixed(2)} MB`;
        } else if (totalSize > 0) {
          const percent = Math.min(100, (event.loaded / totalSize) * 100);
          progress.style.width = percent + "%";
          details.textContent =
            `${percent.toFixed(1)}% • ${loadedMB} MB / ${(totalSize / 1048576).toFixed(2)} MB`;
        } else {
          details.textContent = `${loadedMB} MB downloaded`;
        }
      };

      xhr.onload = () => {
        if (xhr.status !== 200) {
          showError("Download failed. HTTP " + xhr.status);
          return;
        }

        statusText.textContent = "Starting Zeta Client...";
        progress.style.width = "100%";
        details.textContent = "Preparing game...";

        const reader = new FileReader();

        reader.onload = () => {
          game.srcdoc = reader.result;
          loader.style.display = "none";
          game.style.display = "block";
        };

        reader.onerror = () => {
          showError("Could not read the downloaded client.");
        };

        reader.readAsText(xhr.response);
      };

      xhr.onerror = () => {
        showError("Network error while downloading Zeta Client.");
      };

      xhr.send();
    }

    function showError(message) {
      statusText.textContent = "Unable to load Zeta Client";
      details.textContent = "";
      errorMessage.textContent = message;
      errorBox.style.display = "block";
    }

    loadClient();
  </script>
</body>
</html>
