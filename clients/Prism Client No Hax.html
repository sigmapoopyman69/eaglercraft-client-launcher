
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="1.8.8 Utility">
<title>eberttek</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #1746d1;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#loader {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    text-align: center;
}

.logo {
    width: min(520px, 85vw);
    max-height: 260px;
    object-fit: contain;
    margin-bottom: 25px;
}

#status {
    font-size: 16px;
    margin-bottom: 12px;
}

.progress-container {
    width: min(420px, 85vw);
    height: 12px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 20px;
    overflow: hidden;
}

#progress {
    width: 0%;
    height: 100%;
    background: #ff1744;
    transition: width 0.15s ease;
}

#details {
    margin-top: 12px;
    font-size: 14px;
}

#retry {
    display: none;
    margin-top: 18px;
    padding: 10px 24px;
    border: none;
    border-radius: 6px;
    background: #ff1744;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

#gameFrame {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: black;
}
</style>
</head>

<body>

<div id="loader">
    <img
        class="logo"
        src="https://raw.githubusercontent.com/sigmapoopyman69/eaglercraft-client-launcher/main/amazing_logo.png"
        alt="Eaglercraft Logo"
    >

    <div id="status">loading client...</div>

    <div class="progress-container">
        <div id="progress"></div>
    </div>

    <div id="details">starting stuff...</div>

    <button id="retry" onclick="startLoading()">retry</button>
</div>

<iframe
    id="gameFrame"
    allow="fullscreen; autoplay; clipboard-read; clipboard-write"
    allowfullscreen
></iframe>

<script>
const SOURCE =
    "https://raw.githubusercontent.com/MilkdromedaStudios/all-of-eaglercraft/refs/heads/main/Prism%20Client.html";

const loader = document.getElementById("loader");
const statusText = document.getElementById("status");
const progressBar = document.getElementById("progress");
const details = document.getElementById("details");
const retryButton = document.getElementById("retry");
const gameFrame = document.getElementById("gameFrame");

function formatMB(bytes) {
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

function getFileSize() {
    return new Promise(resolve => {
        const xhr = new XMLHttpRequest();

        xhr.open("HEAD", SOURCE, true);
        xhr.onload = () => {
            const size = Number(xhr.getResponseHeader("Content-Length"));
            resolve(size > 0 ? size : null);
        };
        xhr.onerror = () => resolve(null);
        xhr.send();
    });
}

function showError(message) {
    statusText.textContent = message;
    details.textContent = "The client could not be downloaded.";
    retryButton.style.display = "block";
}

function startLoading() {
    retryButton.style.display = "none";
    gameFrame.style.display = "none";
    loader.style.display = "flex";

    statusText.textContent = "downloading files...";
    details.textContent = "fetching files...";
    progressBar.style.width = "0%";

    getFileSize().then(totalSize => {
        const xhr = new XMLHttpRequest();

        xhr.open("GET", SOURCE, true);
        xhr.responseType = "blob";

        xhr.onprogress = event => {
            const downloaded = event.loaded;

            if (event.lengthComputable && event.total > 0) {
                const percent = Math.round(
                    (downloaded / event.total) * 100
                );

                progressBar.style.width = percent + "%";
                details.textContent =
                    percent + "% — " + formatMB(downloaded) +
                    " / " + formatMB(event.total);
            } else if (totalSize) {
                const percent = Math.min(
                    100,
                    Math.round((downloaded / totalSize) * 100)
                );

                progressBar.style.width = percent + "%";
                details.textContent =
                    percent + "% — " + formatMB(downloaded) +
                    " / " + formatMB(totalSize);
            } else {
                details.textContent =
                    formatMB(downloaded) + " downloaded";
            }
        };

        xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
                statusText.textContent = "starting...";
                progressBar.style.width = "100%";

                const reader = new FileReader();

                reader.onload = () => {
                    const html = reader.result;
                    let launched = false;

                    const finishLaunch = () => {
                        if (launched) return;
                        launched = true;

                        loader.style.display = "none";
                        gameFrame.style.display = "block";
                    };

                    gameFrame.onload = finishLaunch;
                    gameFrame.srcdoc = html;

                    setTimeout(finishLaunch, 5000);
                };

                reader.onerror = () => {
                    showError("Failed to read client file.");
                };

                reader.readAsText(xhr.response);
            } else {
                showError("Download failed (HTTP " + xhr.status + ").");
            }
        };

        xhr.onerror = () => {
            showError("Network error while downloading.");
        };

        xhr.onabort = () => {
            showError("Download was interrupted.");
        };

        xhr.send();
    });
}

startLoading();
</script>

</body>
</html>
